version: '3.9'

services:
  # ============================================================
  # PostgreSQL Database
  # ============================================================
  db:
    image: postgres:15-alpine
    container_name: lams_db
    environment:
      POSTGRES_DB: lams_db
      POSTGRES_USER: lams_user
      POSTGRES_PASSWORD: lams_password_secure_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - lams_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lams_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis Cache (Optional)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: lams_redis
    ports:
      - "6379:6379"
    networks:
      - lams_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Django Backend
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lams_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 
                      --workers 4 
                      --timeout 120 
                      --access-logfile - 
                      --error-logfile - 
                      backend.wsgi:application"
    environment:
      DEBUG: 'False'
      DATABASE_URL: postgresql://lams_user:lams_password_secure_change_me@db:5432/lams_db
      SECRET_KEY: django-insecure-change-this-key-in-production-min-50-chars
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lams_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # React Frontend (Development)
  # ============================================================
  frontend:
    image: node:18-alpine
    container_name: lams_frontend
    working_dir: /app/frontend
    command: npm run dev
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - lams_network

  # ============================================================
  # Nginx Reverse Proxy (Production)
  # ============================================================
  # Uncomment this section for production deployment
  # nginx:
  #   image: nginx:alpine
  #   container_name: lams_nginx
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - static_volume:/app/staticfiles:ro
  #     - media_volume:/app/media:ro
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   depends_on:
  #     - backend
  #     - frontend
  #   networks:
  #     - lams_network

# ============================================================
# Volumes
# ============================================================
volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

# ============================================================
# Networks
# ============================================================
networks:
  lams_network:
    driver: bridge
